<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Explorer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        input,
        select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        #product-list {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(220px, 1fr)
            );
            gap: 20px;
            max-width: 1100px;
            margin: auto;
        }

        .product-card {
            background-color: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: contain;
            display: block;
            margin-bottom: 10px;
        }

        .product-card h3 {
            margin: 8px 0;
        }

        .product-card p {
            margin: 6px 0;
        }

        .price {
            font-weight: bold;
        }

        .empty {
            text-align: center;
            grid-column: 1 / -1;
        }
    </style>
</head>

<body>

    <h1>Product Explorer</h1>

    <div class="controls">

        <input
            type="text"
            id="search"
            placeholder="Cari produk..."
        >

        <select id="category">
            <option value="all">
                Semua Kategori
            </option>
        </select>

        <select id="sort">

            <option value="default">
                Urutan Default
            </option>

            <option value="price-low">
                Harga Terendah
            </option>

            <option value="price-high">
                Harga Tertinggi
            </option>

            <option value="rating">
                Rating Tertinggi
            </option>

        </select>

    </div>

    <div id="product-list">
        <p class="empty">
            Memuat produk...
        </p>
    </div>

    <script
        type="module"
        src="js/main.js"
    ></script>

</body>

</html>
